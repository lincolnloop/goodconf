---
name: test

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  tox:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - py311-django52
          - py312-django60
          - py313-django60
          - py314-django60
          - py315-django61
          - dev
          - mypy
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run tox
        run: uvx --with tox-uv tox -e "${{ matrix.env }}"

      - name: Upload coverage to Codecov
        if: ${{ (success() || failure()) && matrix.env != 'mypy' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.env }}
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ (success() || failure()) && matrix.env != 'mypy' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: ${{ matrix.env }}
          fail_ci_if_error: true
